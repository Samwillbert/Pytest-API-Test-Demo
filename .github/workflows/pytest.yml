# =========================================================
# GitHub Actions Workflow for Pytest API Testing
# With Allure HTML Report Generation
# =========================================================

# Workflow name shown in GitHub Actions tab
name: Pytest API Testing

# =========================================================
# EVENTS THAT TRIGGER THE WORKFLOW
# =========================================================
on:
  # Trigger workflow when code is pushed to main branch
  push:
    branches:
      - "main"

  # Trigger workflow when Pull Request is created for main branch
  pull_request:
    branches:
      - "main"

  # Allows manual execution from GitHub Actions UI
  workflow_dispatch:

# =========================================================
# PERMISSIONS
# =========================================================
permissions:
  # Gives read-only access to repository contents
  contents: read

# =========================================================
# JOBS SECTION
# =========================================================
jobs:
  # Job name
  Pytest-API-Testing:
    # GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # =====================================================
    # STEPS EXECUTED INSIDE THE JOB
    # =====================================================
    steps:
      # ---------------------------------------------------
      # Step 1: Checkout repository code
      # ---------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Step 2: Install Python
      # ---------------------------------------------------
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ---------------------------------------------------
      # Step 3: Install project dependencies
      # ---------------------------------------------------
      - name: Install Dependencies
        run: |
          # Upgrade pip
          python -m pip install --upgrade pip

          # Install dependencies from requirements.txt
          pip install -r requirements.txt

      # ---------------------------------------------------
      # Step 4: Install Java
      # Allure requires Java to generate HTML reports
      # ---------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ---------------------------------------------------
      # Step 5: Install Allure Commandline Tool
      # ---------------------------------------------------
      - name: Install Allure
        run: |
          npm install -g allure-commandline --save-dev

      # ---------------------------------------------------
      # Step 6: Run Pytest and Generate Allure Results
      # ---------------------------------------------------
      - name: Run Pytest API Tests
        run: |
          # ENV variable for test environment
          ENV=dev pytest --alluredir=allure-results

      # ---------------------------------------------------
      # Step 7: Generate Allure HTML Report
      # ---------------------------------------------------
      - name: Generate Allure HTML Report
        run: |
          allure generate allure-results --clean -o allure-report

      # ---------------------------------------------------
      # Step 8: Upload HTML Report as Artifact
      # ---------------------------------------------------
      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          # Artifact name visible in GitHub Actions
          name: allure-html-report

          # Upload generated HTML report folder
          path: allure-report
